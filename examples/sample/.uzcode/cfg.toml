[llm]
base_url = "http://127.0.0.1:8081/v1"
api_key = "1"
model = "1"

[loop]
auto_loop = true
max_iterations = 20

[tools.read_file]
require_confirm = false

[tools.write_file]
require_confirm = true
preview_diff = true
retry = 0
on_failure = "abort"

[middleware]
order = ["preprocesser", "logging"]
