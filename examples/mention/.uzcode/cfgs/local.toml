[llm]
base_url = "http://127.0.0.1:8081/v1"
api_key = "1"
model = "1"

[messagelib.__system]
role = "system"
content = "You are a coding agent. Be concise and helpful."

[messagelib.__skill]
role = "system"
content = ""

[loop]
auto_loop = true
max_iterations = 20

[tools.read_file]
enable = true
permission = "approve"

[tools.file_status]
enable = true
permission = "approve"

[tools.list_dir]
enable = true
permission = "approve"

[tools.grep]
enable = true
permission = "approve"

[tools.write_file]
enable = true
permission = "ask"
preview_diff = true
retry = 0
on_failure = "abort"

[tools.edit_file]
enable = true
permission = "ask"
preview_diff = true
retry = 0
on_failure = "abort"

[tools.summarize_task]
enable = true
permission = "approve"

[tools.read_skill]
enable = true
permission = "approve"

[tools.read_file_in_skill]
enable = true
permission = "approve"

[tools.sh]
enable = true
permission = "ask"
timeout_sec = 60

[tools.web_search]
enable = true
permission = "approve"
max_results = 5

[tools.web_fetch]
enable = true
permission = "approve"
max_chars = 32768
timeout_sec = 30

[extension]
enable = ["logging", "file_cru", "task_summary", "skills", "shell", "web"]

# [skills]
# omit enable = list all discovered + code-registered skills
# enable = []              # no catalog, no read_skill tools
# enable = ["demo-skill"]  # whitelist only

[exts.task_summary]
auto_open = true
task_summary_path = ".uzcode/summaries"

[extension.order.handle_request]
file_cru = 10
skills = 20
web = 30

[extension.order.before_llm]
logging = 10
skills = 20

[extension.order.after_llm]
logging = 100

[extension.order.before_tool]
file_cru = 50
