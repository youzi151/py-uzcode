[project]
name = "uzcode"
version = "0.1.0"
description = "A minimal, stateless AI coding agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "tomli-w>=1.0",
    "langgraph>=1.0",
    "litellm>=1.0",
]

[project.scripts]
uzcode = "uzcode.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/uzcode"]
